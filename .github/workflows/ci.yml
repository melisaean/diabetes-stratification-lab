name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[all]"

      - name: Lint
        run: ruff check src/ tests/ app/

      - name: Type check
        run: mypy src/ app/ --ignore-missing-imports

      - name: Tests
        run: pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t diabetes-stratification-lab:ci .

      - name: Smoke test image
        run: |
          docker run --rm diabetes-stratification-lab:ci \
            python -c "from app.main import app; print('App imported OK'); print([getattr(r, 'path', '') for r in app.routes])"
