[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "diabetes-stratification-lab"
version = "1.0.0"
description = "Unsupervised patient stratification for diabetic readmission risk using manifold learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Melly"}]
keywords = ["machine-learning", "healthcare", "diabetes", "patient-stratification", "manifold-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.4",
    "plotly>=5.22,<7.0",
    "pydantic-settings>=2.0",
    "pydantic>=2.0,<3.0",
    "starlette>=0.37",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "umap-learn>=0.5.6",
    "numba>=0.59",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]
all = ["diabetes-stratification-lab[train,dev]"]

[project.urls]
Repository = "https://github.com/melisaean/diabetes-stratification-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"